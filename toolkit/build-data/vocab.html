<style>
/* vocab training: the course's B1+ words (VOCAB from vocab.json), learnt with new-word cards, spaced review, quizzes and progress, kept on this device */
.pane-vocab{direction:rtl;text-align:right;font-family:var(--font-fa);line-height:1.9}
.pane-vocab .en,.pane-vocab .ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--font-sans)}
.vstats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:0 0 1rem}
.vstats>*{border:2px solid var(--ink);padding:.4rem .3rem;text-align:center;line-height:1.4;background:var(--paper);color:var(--ink);font:inherit}
.vstats button{cursor:pointer}.vstats button span::after{content:" ›"}
.vgrp{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0 0 .8rem}.vgrp h3{margin:0;flex:1 1 100%;font-size:1.1rem}
.vstats b{display:block;font-size:1.35rem;font-family:var(--font-sans)}
.vstats span{font-size:.78rem;color:var(--muted)}
.vstats .s1{box-shadow:4px 4px 0 var(--red)}.vstats .s2{box-shadow:4px 4px 0 var(--blue)}.vstats .s3{box-shadow:4px 4px 0 var(--yellow)}.vstats .s4{box-shadow:4px 4px 0 var(--ink)}
.vgoal{font-size:.9rem;margin:0 0 .9rem}
.vgoal .bar,.vlv .bar{height:.55rem;border:1.5px solid var(--ink);background:var(--paper);margin-top:.25rem;overflow:hidden}
.vgoal .bar i,.vlv .bar i{display:block;height:100%;background:var(--red)}
.vchips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.2rem 0 .7rem;align-items:center}
.vchips .lab{font-size:.85rem;color:var(--muted);margin-inline-end:.2rem}
.vchips button{font:inherit;font-size:.85rem;cursor:pointer;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:.05rem .65rem;border-radius:1rem}
.vchips button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.vmodes{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:1rem 0 1.2rem}
.vmodes .btn{padding:.7rem .5rem;font-weight:700;line-height:1.5}
.vmodes .btn small{display:block;font-weight:400;font-size:.8rem;opacity:.85}
.vlv{display:grid;grid-template-columns:4.5rem 1fr 4.2rem;gap:.5rem;align-items:center;font-size:.85rem;margin:.25rem 0}
.vlv .n{font-family:var(--font-sans);color:var(--muted);text-align:left;direction:ltr}
.vlv .bar{margin:0}
.lvb{display:inline-block;font-family:var(--font-sans);font-size:.72rem;font-weight:700;border:1.5px solid var(--ink);padding:0 .35rem;line-height:1.5;vertical-align:middle}
.lvb.B1{background:#fff}.lvb.B2{background:var(--yellow-soft)}.lvb.C1{background:var(--yellow)}.lvb.C2{background:var(--red);color:#fff;border-color:var(--red)}.lvb.AC{background:var(--blue);color:#fff;border-color:var(--blue)}
.vcard{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--yellow);padding:1.1rem 1rem;margin:0 0 1rem;text-align:center}
.vcard .top{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:.3rem}
.vcard .big{font-size:2rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap}
.vcard .fa{font-size:1.3rem;font-weight:700;margin-top:.6rem}
.pane-vocab .ex{direction:ltr;text-align:left;font-family:var(--font-sans);font-size:.98rem;line-height:1.6;margin:.9rem 0 .2rem;color:var(--ink);border-inline-start:4px solid var(--yellow);padding:.2rem .6rem}
.pane-vocab .ex b{background:var(--mark)}
.pane-vocab .src{font-size:.78rem;color:var(--muted)}
.pane-vocab .snd{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:.6rem}
.pane-vocab .snd .btn{font-size:.85rem;padding:.15rem .7rem}
.vcard .row{display:flex;gap:.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.vcard .q{font-size:1.15rem;margin:.4rem 0 .2rem}
.vopts{display:grid;gap:.5rem;margin-top:.9rem}
.vopts button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:.5rem .7rem;text-align:center;font-size:1.05rem}
.vopts button.ok{background:#1f7a3a;border-color:#1f7a3a;color:#fff}
.vopts button.bad{background:var(--red);border-color:var(--red);color:#fff}
.vopts button:disabled{cursor:default}
.vtype{display:flex;gap:.5rem;justify-content:center;margin-top:.9rem;direction:ltr}
.vtype input{font:inherit;font-family:var(--font-sans);font-size:1.15rem;border:2px solid var(--ink);padding:.3rem .6rem;width:min(16rem,70vw);text-align:center}
.vfb{margin-top:.8rem;font-weight:700}
.vfb.ok{color:#1f7a3a}.vfb.bad{color:var(--red)}
.vmsg{font-size:.85rem;color:var(--muted);min-height:1.2em}
.vsearch{font:inherit;width:100%;box-sizing:border-box;border:2px solid var(--ink);padding:.35rem .7rem;margin:0 0 .6rem;direction:ltr;font-family:var(--font-sans)}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{border-bottom:1px solid var(--rule);padding:.4rem 0}
.vlist .r{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.vlist .w{direction:ltr;font-family:var(--font-sans);font-weight:700;min-width:7rem}
.vlist .m{flex:1;min-width:0;font-size:.95rem}
.vlist .dots{font-size:.7rem;color:var(--muted);white-space:nowrap;direction:ltr}
.vlist .more{padding:.3rem 0 .2rem}
.vlist .more .ex{direction:ltr;text-align:left;font-family:var(--font-sans);font-size:.92rem;line-height:1.55;color:var(--muted)}
.vlist .more .ex b{color:var(--ink);background:var(--mark)}
.vres li{direction:rtl}
@media (max-width:420px){.vstats{grid-template-columns:repeat(2,1fr)}.vcard .big{font-size:1.7rem}}
</style>
<script>
(function(){
  const R=window.DTAD, V=window.VOCAB, CA=window.CLASS_AUDIO, pane=document.querySelector('.pane-vocab'); if(!R||!V||!pane) return;
  const KEY='dtad-vocab', DAY=864e5, GAP=[0,1,2,4,8,16,32];   // Leitner boxes 0..6, box>=4 counts as "learnt"
  const LV=['B1','B2','C1','C2','C2+'], LVN={'B1':'B1','B2':'B2','C1':'C1','C2':'C2','C2+':'AC'}, LVF={'C2+':'آکادمیک'};
  // sources: class sessions (s1, s2 ...) and readings (pdf); each word keeps one sentence per source it appears in
  const SRC=V.src, SRCL={}, PDF=SRC.filter(s=>s[2]==='pdf').map(s=>s[0]); SRC.forEach(s=>SRCL[s[0]]=s[1]);
  const W=V.w.map(v=>({w:v[0],l:v[1],fa:v[2],src:v[3],ss:Object.keys(v[3])}));
  const inSrc=(x,f)=>!f||(f==='pdf'?x.ss.some(s=>PDF.includes(s)):x.ss.includes(f));
  // the sentence shown for a word: from the chosen source if it has one, else from class, else from a reading
  function pick(){const f=S.o.ss; W.forEach(x=>{
    const k=(f&&f!=='pdf'&&x.src[f])?f:(f==='pdf'?x.ss.find(s=>PDF.includes(s)):null)||x.ss.find(s=>s[0]==='s'&&!PDF.includes(s))||x.ss[0];
    const e=x.src[k]; x.k=k; x.ex=e[0]; x.f=e[1]; x.t=e[2]; x.n=e[3]; x.cls=!PDF.includes(k); x.sid=x.cls?String(k.slice(1)).padStart(2,'0'):null;});}
  let S={}; try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  S.p=S.p||{}; S.d=S.d||{}; S.o=S.o||{lv:['B1','B2','C1','C2','C2+'],ss:'',goal:10,dir:'en'};
  if(S.o.ss==='1'||S.o.ss==='2') S.o.ss='s'+S.o.ss; if(S.o.ss&&S.o.ss!=='pdf'&&!SRC.some(s=>s[0]===S.o.ss)) S.o.ss='';
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const FA=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
  const dayRec=()=>S.d[today()]||(S.d[today()]={n:0,r:0,q:0});
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const P=x=>S.p[x.w];
  const pool=()=>W.filter(x=>S.o.lv.includes(x.l)&&inSrc(x,S.o.ss));
  const fresh=()=>pool().filter(x=>!P(x));
  const due=()=>W.filter(x=>P(x)&&P(x).b<6&&P(x).due<=Date.now()&&S.o.lv.includes(x.l)&&inSrc(x,S.o.ss));
  const learnt=x=>P(x)&&P(x).b>=4;
  function streak(){let n=0;const d=new Date();if(!active(d)) d.setDate(d.getDate()-1);
    while(active(d)){n++;d.setDate(d.getDate()-1);} return n;
    function active(d){const r=S.d[d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()];return r&&(r.n+r.r+r.q)>0;}}
  function grade(x,ok){const p=S.p[x.w]||(S.p[x.w]={b:0,due:0,ok:0,bad:0});
    if(ok){p.b=Math.min(6,p.b+1);p.ok++;} else {p.b=1;p.bad++;}
    p.due=Date.now()+(ok?GAP[p.b]*DAY:0); save();}
  const hl=(x)=>{const e=esc(x.ex), f=x.f.replace(/[^a-z'-]/gi,''); return f?e.replace(new RegExp('\\b('+f+')\\b','i'),'<b>$1</b>'):e;};
  const lvb=x=>'<span class="lvb '+LVN[x.l]+'">'+(LVF[x.l]||x.l)+'</span>';

  // sounds: the word (offline mp3), the class sentence (device voice) and the professor saying it (class recording, online)
  let au=null, auTimer=null;
  const toTop=()=>{const n=document.querySelector('.sessiontabs'); if(n&&pane.getBoundingClientRect().top<0) n.scrollIntoView();};
  function stopAll(){ if(au){au.pause();au=null;} clearTimeout(auTimer); if(window.speechSynthesis) speechSynthesis.cancel(); pane.querySelectorAll('.on').forEach(b=>b.classList.remove('on')); }
  // words heard in class have offline audio in the dictionary; reading-only words load theirs (internet) or use the device voice
  function say(text,btn){const ss=window.speechSynthesis; const v=ss&&(ss.getVoices().find(v=>/^en/i.test(v.lang)&&v.localService!==false)||ss.getVoices().find(v=>/^en/i.test(v.lang)));
    if(!ss||!v) return false; const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=.9;btn&&btn.classList.add('on');u.onend=u.onerror=()=>btn&&btn.classList.remove('on');ss.speak(u);return true;}
  const word=(x,btn)=>{stopAll(); if(R.D[x.w]) return R.playKeys([x.w],btn);
    const a=au=new Audio(V.audio+'vocab-audio/'+encodeURIComponent(x.w)+'.mp3'); btn&&btn.classList.add('on');
    a.onended=()=>btn&&btn.classList.remove('on'); a.onerror=()=>{btn&&btn.classList.remove('on'); if(au===a) say(x.w,btn);};
    a.play().catch(()=>{});};
  function sentence(x,btn){
    stopAll(); const text=x.ex.replace(/…/g,''); if(say(text,btn)) return;
    const keys=(text.match(/[A-Za-z][A-Za-z'’-]*[A-Za-z]|[A-Za-z]/g)||[]).map(R.find).filter(Boolean); R.playKeys(keys,btn);
  }
  function classSay(x,btn,msg){
    stopAll(); const parts=CA&&CA.sessions[x.sid]; if(!parts){msg('صدای کلاس برای این جلسه نیست.');return;}
    const k=Math.floor(x.t/CA.chunk), off=x.t-k*CA.chunk;
    au=new Audio(CA.base+'class-audio/'+parts[0].dir+'/'+String(k).padStart(3,'0')+'.mp3'); const a=au;
    btn.classList.add('on'); msg('در حال بارگیری صدای کلاس…');
    a.addEventListener('loadedmetadata',()=>{a.currentTime=Math.min(off,Math.max(0,a.duration-1));});
    a.addEventListener('playing',()=>{msg(''); clearTimeout(auTimer); auTimer=setTimeout(()=>{a.pause();btn.classList.remove('on');},9000);});
    a.addEventListener('ended',()=>btn.classList.remove('on'));
    a.addEventListener('error',()=>{btn.classList.remove('on');msg('صدای کلاس باز نشد (اینترنت لازم است).');});
    a.play().catch(()=>{});
  }
  function sounds(el,x){
    const m=el.querySelector('.vmsg'), msg=t=>{if(m) m.textContent=t;};
    el.querySelectorAll('[data-snd]').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.snd; if(k==='w') word(x,b); else if(k==='s') sentence(x,b); else classSay(x,b,msg);});
  }
  const sndRow=(withWord,x)=>'<div class="snd">'+(withWord?'<button type="button" class="btn" data-snd="w">▶ کلمه</button>':'')+
    '<button type="button" class="btn" data-snd="s">🔊 جمله</button>'+(CA&&x&&x.cls&&x.t>=0?'<button type="button" class="btn" data-snd="c">🎧 صدای استاد</button>':'')+'</div><div class="vmsg"></div>';
  const exBlock=x=>'<p class="ex">'+hl(x)+'</p><div class="src">'+(x.cls?'از جلسه‌ی '+FA(+x.sid)+'؛ این کلمه '+FA(x.n)+' بار در کلاس آمده':'از متن <span class="en">'+esc(SRCL[x.k])+'</span>؛ '+FA(x.n)+' بار در متن آمده')+
    (x.ss.length>1?'<br>در: '+x.ss.map(s=>'<span class="en">'+esc(SRCL[s])+'</span>').join('، '):'')+'</div>';

  // ---------- home ----------
  function home(keep){
    stopAll(); if(!keep) toTop(); const all=pool(), d=due().length, nf=fresh().length, rec=dayRec(), goal=S.o.goal, left=Math.max(0,goal-rec.n);
    const seen=W.filter(P).length, L=W.filter(learnt).length;
    const chips=(lab,items,on,attr)=>'<div class="vchips"><span class="lab">'+lab+'</span>'+items.map(([v,t])=>'<button type="button" data-'+attr+'="'+esc(v)+'" aria-pressed="'+on(v)+'">'+t+'</button>').join('')+'</div>';
    pane.innerHTML=
      '<p class="howto" style="margin:0 0 .8rem">'+FA(W.length)+' کلمه‌ی سطح B1 و بالاتر از حرف‌های کلاس و متن‌های درس (PDFها)، با معنی فارسی، تلفظ و یک جمله از همان کلاس یا متن. با «منبع» انتخاب کن از کدام جلسه یا کدام PDF تمرین کنی. هر روز چند کلمه‌ی تازه یاد بگیر و مرورها را انجام بده؛ پیشرفتت روی همین گوشی ذخیره می‌شود.</p>'+
      '<div class="vstats"><div class="s1"><b>'+FA(streak())+'</b><span>🔥 روز پشت سر هم</span></div><button type="button" class="s2" data-g="learnt"><b>'+FA(L)+'</b><span>یاد گرفته</span></button><button type="button" class="s3" data-g="learning"><b>'+FA(seen-L)+'</b><span>در حال یادگیری</span></button><button type="button" class="s4" data-g="new"><b>'+FA(W.length-seen)+'</b><span>هنوز ندیده</span></button></div>'+
      '<div class="vgoal">هدف امروز: '+FA(Math.min(rec.n,goal))+' از '+FA(goal)+' کلمه‌ی تازه'+(rec.n>=goal?' ✓':'')+'<div class="bar"><i style="width:'+Math.min(100,rec.n/goal*100)+'%"></i></div></div>'+
      chips('سطح:',LV.map(l=>[l,LVF[l]||l]),v=>S.o.lv.includes(v),'lv')+
      chips('منبع:',[['','همه']].concat(SRC.filter(s=>s[2]==='class').map(s=>[s[0],s[1]]),[['pdf','همه‌ی PDFها']],SRC.filter(s=>s[2]==='pdf').map(s=>[s[0],'<span class="en">'+esc(s[1])+'</span>'])),v=>S.o.ss===v,'ss')+
      chips('هدف روزانه (فقط برای انگیزه، محدودیت نیست):',[['5','۵'],['10','۱۰'],['20','۲۰'],['30','۳۰']],v=>S.o.goal==v,'goal')+
      '<div class="vmodes">'+
        '<button type="button" class="btn go" data-m="learn"'+(nf?'':' disabled')+'>یادگیری کلمه‌ی تازه<small>'+(left?'هدف امروز: '+FA(left)+' کلمه‌ی دیگر؛ بیشتر هم می‌توانی':'هدف امروز انجام شد؛ هر چقدر بخواهی ادامه بده')+'</small></button>'+
        '<button type="button" class="btn" data-m="review"'+(d?'':' disabled')+'>مرور<small>'+FA(d)+' کلمه منتظر مرور</small></button>'+
        '<button type="button" class="btn" data-m="quiz">کوییز<small>۱۰ سؤال: معنی، شنیدن، جای خالی، نوشتن</small></button>'+
        '<button type="button" class="btn" data-m="list">همه‌ی کلمه‌ها<small>'+FA(all.length)+' کلمه با فیلتر فعلی</small></button>'+
      '</div>'+
      '<div style="font-size:.9rem;margin-bottom:.3rem">پیشرفت در هر سطح</div>'+
      LV.map(l=>{const t=W.filter(x=>x.l===l), k=t.filter(learnt).length; return '<div class="vlv"><span>'+lvb(t[0])+'</span><div class="bar"><i style="width:'+(t.length?k/t.length*100:0)+'%"></i></div><span class="n">'+k+' / '+t.length+'</span></div>';}).join('')+
      '<p class="vmsg" style="margin-top:1rem">روی هر کدام از خانه‌های بالا بزن تا کلمه‌هایش را ببینی و همان‌ها را تمرین کنی. کلمه‌هایی که «باید بیشتر تمرین کنم» زده‌ای یا در مرور و کوییز اشتباه کرده‌ای، در «در حال یادگیری» هستند تا چند بار پشت سر هم درست جواب بدهی.</p>';
    pane.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{const v=b.dataset.lv,i=S.o.lv.indexOf(v); if(i>=0){if(S.o.lv.length>1) S.o.lv.splice(i,1);} else S.o.lv.push(v); save(); home(1);});
    pane.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{S.o.ss=b.dataset.ss; save(); pick(); home(1);});
    pane.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.o.goal=+b.dataset.goal; save(); home(1);});
    pane.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>({learn,review,quiz,list}[b.dataset.m])());
    pane.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>list(b.dataset.g));
  }
  const back='<button type="button" class="btn back">برگشت</button>';
  const wireBack=()=>pane.querySelectorAll('.back').forEach(b=>b.onclick=()=>home());

  // ---------- learn: new words, most frequent in class first ----------
  function learn(){
    const q=fresh().sort((a,b)=>LV.indexOf(a.l)-LV.indexOf(b.l)||b.n-a.n), done=[];   // no daily cap: go on as long as you like
    (function next(){
      stopAll(); toTop(); if(!q.length) return finish('learn',done);
      const x=q[0];
      pane.innerHTML='<div class="vcard"><div class="top"><span>امروز '+FA(dayRec().n)+' کلمه‌ی تازه'+(dayRec().n>=S.o.goal?' ✓':'')+' · '+FA(q.length)+' مانده</span>'+lvb(x)+'</div>'+
        '<div class="big"><span class="en">'+esc(x.w)+'</span><button type="button" class="play" data-snd="w" aria-label="Play">▶</button></div>'+
        '<div class="fa">'+esc(x.fa)+'</div>'+exBlock(x)+sndRow(false,x)+
        '<div class="row"><button type="button" class="btn go nx">یاد گرفتم</button><button type="button" class="btn pr">باید بیشتر تمرین کنم</button><button type="button" class="btn kn">از قبل بلد بودم</button></div></div>'+back;
      sounds(pane,x); wireBack(); word(x,pane.querySelector('.big .play'));
      // learnt now -> box 4 (back for review in 8 days); needs practice -> box 1, due now ("in progress"); known already -> box 5
      const go=b=>{S.p[x.w]={b,due:Date.now()+(b>1?GAP[b]*DAY:0),ok:0,bad:0}; dayRec().n++; save(); done.push(x); q.shift(); next();};
      pane.querySelector('.nx').onclick=()=>go(4); pane.querySelector('.pr').onclick=()=>go(1); pane.querySelector('.kn').onclick=()=>go(5);
    })();
  }
  // ---------- review: flashcards (English side or Persian side first) ----------
  function review(set){
    const q=shuffle((Array.isArray(set)?set:due()).slice()), done=[]; let shown=false;
    (function next(){
      stopAll(); toTop(); if(!q.length) return finish('review',done);
      const x=q[0], fa1=S.o.dir==='fa';
      pane.innerHTML='<div class="vcard"><div class="top"><span>'+FA(q.length)+' کلمه مانده</span>'+lvb(x)+'</div>'+
        (fa1&&!shown?'<div class="q">این کلمه به انگلیسی چیست؟</div><div class="fa">'+esc(x.fa)+'</div>'
          :'<div class="big"><span class="en">'+esc(x.w)+'</span><button type="button" class="play" data-snd="w" aria-label="Play">▶</button></div>'+(shown?'<div class="fa">'+esc(x.fa)+'</div>':''))+
        (shown||!fa1?exBlock(x)+sndRow(false,x):'')+
        (shown?'<div class="row"><button type="button" class="btn ok yes">بلد بودم</button><button type="button" class="btn no">بلد نبودم</button></div>'
          :'<div class="row"><button type="button" class="btn go show">'+(fa1?'جواب را نشان بده':'معنی را نشان بده')+'</button></div>')+
        '</div><div class="vchips"><span class="lab">روی کارت اول:</span><button type="button" data-dir="en" aria-pressed="'+!fa1+'">انگلیسی</button><button type="button" data-dir="fa" aria-pressed="'+fa1+'">فارسی</button></div>'+back;
      sounds(pane,x); wireBack();
      pane.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{S.o.dir=b.dataset.dir;save();shown=false;next();});
      if(!shown){ if(!fa1) word(x,pane.querySelector('.big .play')); pane.querySelector('.show').onclick=()=>{shown=true;next(); if(fa1) word(x,pane.querySelector('.big .play'));}; return; }
      pane.querySelector('.yes').onclick=()=>{grade(x,true); dayRec().r++; save(); done.push(x); q.shift(); shown=false; next();};
      pane.querySelector('.no').onclick=()=>{grade(x,false); dayRec().r++; save(); q.push(q.shift()); shown=false; next();};
    })();
  }
  // ---------- quiz: 10 mixed questions ----------
  function quiz(set){
    let base=Array.isArray(set)&&set.length?set.slice():pool().filter(P); if(base.length<10) base=base.concat(shuffle(pool().filter(x=>!P(x))).slice(0,10-base.length));
    const qs=shuffle(base.slice()).slice(0,10), wrong=[]; let i=0, score=0;
    const types=['enfa','faen','listen','gap','type'];
    const distract=(x,key)=>{const same=pool().filter(y=>y!==x&&y[key]!==x[key]); const near=same.filter(y=>y.l===x.l); return shuffle(near.length>=3?near:same).slice(0,3);};
    (function next(){
      stopAll(); toTop(); if(i>=qs.length) return result();
      const x=qs[i], t=types[Math.floor(Math.random()*types.length)];
      let q='', opts=null, key='w', label=y=>esc(y.w);
      if(t==='enfa'){q='معنی این کلمه چیست؟<div class="big"><span class="en">'+esc(x.w)+'</span><button type="button" class="play" data-snd="w">▶</button></div>'; opts=shuffle([x,...distract(x,'fa')]); label=y=>esc(y.fa);}
      if(t==='faen'){q='کدام کلمه یعنی:<div class="fa">'+esc(x.fa)+'</div>'; opts=shuffle([x,...distract(x,'w')]); label=y=>'<span class="en">'+esc(y.w)+'</span>';}
      if(t==='listen'){q='گوش کن و کلمه را انتخاب کن<div class="big"><button type="button" class="btn" data-snd="w">▶ دوباره گوش کن</button></div>'; opts=shuffle([x,...distract(x,'w')]); label=y=>'<span class="en">'+esc(y.w)+'</span>';}
      if(t==='gap'){const f=x.f.replace(/[^a-z'-]/gi,''); q='جای خالی در جمله‌ی کلاس:<p class="ex">'+esc(x.ex).replace(new RegExp('\\b'+f+'\\b','i'),'_____')+'</p>'; opts=shuffle([x,...distract(x,'f')]); label=y=>'<span class="en">'+esc(y.f)+'</span>';}
      if(t==='type'){q='بشنو و بنویس<div class="fa">'+esc(x.fa)+'</div><div class="big"><button type="button" class="btn" data-snd="w">▶ گوش کن</button></div>';}
      pane.innerHTML='<div class="vcard"><div class="top"><span>سؤال '+FA(i+1)+' از '+FA(qs.length)+'</span><span>امتیاز: '+FA(score)+'</span></div><div class="q">'+q+'</div>'+
        (opts?'<div class="vopts">'+opts.map((y,k)=>'<button type="button" data-k="'+k+'">'+label(y)+'</button>').join('')+'</div>'
          :'<form class="vtype"><input autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the word"><button class="btn go">بررسی</button></form>')+
        '<div class="fbx"></div></div>'+back;
      sounds(pane,x); wireBack();
      if(t==='listen'||t==='type') word(x,pane.querySelector('[data-snd=w]'));
      const after=ok=>{grade(x,ok); if(ok) score++; else wrong.push(x); dayRec().q++; save();
        pane.querySelector('.fbx').innerHTML='<div class="vfb '+(ok?'ok':'bad')+'">'+(ok?'درست! ✓':'نه؛ جواب درست:')+'</div>'+
          '<div class="big" style="font-size:1.4rem"><span class="en">'+esc(x.w)+'</span><button type="button" class="play" data-snd="w">▶</button></div><div>'+esc(x.fa)+'</div>'+
          (t==='gap'?'':exBlock(x))+sndRow(false,x)+'<div class="row"><button type="button" class="btn go nx">'+(i+1<qs.length?'سؤال بعدی':'نتیجه')+'</button></div>';
        sounds(pane,x); if(!ok) word(x,pane.querySelector('.fbx .play'));
        pane.querySelector('.nx').onclick=()=>{i++;next();}; pane.querySelector('.nx').focus();};
      if(opts) pane.querySelectorAll('.vopts button').forEach(b=>b.onclick=()=>{const y=opts[+b.dataset.k], ok=y===x;
        pane.querySelectorAll('.vopts button').forEach(c=>{c.disabled=true; if(opts[+c.dataset.k]===x) c.classList.add('ok');}); if(!ok) b.classList.add('bad'); after(ok);});
      else { const inp=pane.querySelector('.vtype input'); inp.focus();
        pane.querySelector('.vtype').onsubmit=e=>{e.preventDefault(); if(inp.disabled) return; const v=inp.value.trim().toLowerCase(); if(!v) return; inp.disabled=true; pane.querySelector('.vtype button').disabled=true; after(v===x.w.toLowerCase()||v===x.f.toLowerCase());}; }
    })();
    function result(){
      stopAll(); toTop();
      pane.innerHTML='<div class="vcard"><div class="fa">نتیجه: '+FA(score)+' از '+FA(qs.length)+(score===qs.length?' 🎉':'')+'</div>'+
        (wrong.length?'<p style="margin:.8rem 0 .3rem">این‌ها را دوباره ببین (به مرور هم اضافه شدند):</p><ul class="vlist vres">'+wrong.map(x=>'<li><div class="r"><span class="w">'+esc(x.w)+'</span><span class="m">'+esc(x.fa)+'</span><button type="button" class="play" data-w="'+esc(x.w)+'">▶</button></div></li>').join('')+'</ul>':'')+
        '<div class="row"><button type="button" class="btn go again">کوییز دوباره</button>'+back+'</div></div>';
      pane.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>R.playKeys([b.dataset.w],b)); pane.querySelector('.again').onclick=()=>quiz(set); wireBack();
    }
  }
  function finish(kind,done){
    stopAll(); toTop();
    pane.innerHTML='<div class="vcard"><div class="fa">'+(kind==='learn'?'آفرین! '+FA(done.length)+' کلمه‌ی تازه دیدی. فردا برای مرور برمی‌گردند.':'آفرین! مرور تمام شد.')+' 🎉</div>'+
      '<div class="row"><button type="button" class="btn go qz">یک کوییز کوتاه</button>'+back+'</div></div>';
    pane.querySelector('.qz').onclick=()=>quiz(); wireBack();
  }
  // ---------- list ----------
  // list(): every word under the current filters; list('learnt'|'learning'|'new'): one group, with practice for just those words
  const GROUPS={learnt:['یاد گرفته',learnt],learning:['در حال یادگیری',x=>P(x)&&!learnt(x)],'new':['هنوز ندیده',x=>!P(x)]};
  function list(g){
    stopAll(); toTop(); const G=GROUPS[g], all=G?W.filter(G[1]):pool();
    pane.innerHTML=(G?'<div class="vgrp"><h3>'+G[0]+' ('+FA(all.length)+' کلمه)</h3>'+
        (all.length&&g!=='new'?'<button type="button" class="btn go gr">تمرین با فلش‌کارت</button><button type="button" class="btn gq">کوییز از همین‌ها</button>':'')+
        (g==='new'&&all.length?'<button type="button" class="btn go gl">یادگیری کلمه‌ی تازه</button>':'')+'</div>':'')+
      '<input class="vsearch" type="search" placeholder="search / جست‌وجو">'+back+'<ul class="vlist" style="margin-top:.6rem"></ul>';
    const ul=pane.querySelector('.vlist'), inp=pane.querySelector('.vsearch'); wireBack();
    const gb=s=>pane.querySelector(s);
    if(gb('.gr')) gb('.gr').onclick=()=>review(W.filter(G[1]));
    if(gb('.gq')) gb('.gq').onclick=()=>quiz(W.filter(G[1]));
    if(gb('.gl')) gb('.gl').onclick=learn;
    if(G&&!all.length) ul.insertAdjacentHTML('beforebegin','<p class="vmsg">هنوز کلمه‌ای اینجا نیست.</p>');
    const dots=x=>{const b=P(x)?P(x).b:0; return '●'.repeat(Math.min(b,4))+'○'.repeat(4-Math.min(b,4));};
    function draw(){const s=inp.value.trim().toLowerCase();
      const rows=all.filter(x=>!s||x.w.includes(s)||x.fa.includes(s)).slice(0,400);
      ul.innerHTML=rows.map(x=>'<li data-w="'+esc(x.w)+'"><div class="r"><span class="w">'+esc(x.w)+'</span>'+lvb(x)+'<span class="m">'+esc(x.fa)+'</span><span class="dots">'+dots(x)+'</span><button type="button" class="play" aria-label="Play">▶</button></div></li>').join('')||'<li>چیزی پیدا نشد.</li>';
      ul.querySelectorAll('li[data-w]').forEach(li=>{const x=W.find(y=>y.w===li.dataset.w);
        li.querySelector('.play').onclick=e=>{e.stopPropagation();word(x,e.currentTarget);};
        li.querySelector('.r').onclick=()=>{const m=li.querySelector('.more'); if(m){m.remove();return;}
          const d=document.createElement('div'); d.className='more'; d.innerHTML=exBlock(x)+sndRow(false,x); li.appendChild(d); sounds(d,x);};});
    }
    inp.oninput=draw; draw();
  }
  document.addEventListener('dtad-tab',e=>{ if(e.detail==='vocab') home(1); else stopAll(); });
  if(window.speechSynthesis) speechSynthesis.getVoices();
  pick(); home();
})();
</script>
