<style>
/* tabs: a row of session tabs (Bauhaus blocks), then transcript / summary / to-do sub-tabs inside each session */
.sessiontabs,.subtabs{display:flex;flex-wrap:wrap;gap:.4rem;direction:rtl}
.sessiontabs{position:sticky;top:0;z-index:10;background:var(--paper);padding:.6rem 0;border-bottom:3px solid var(--ink);margin-bottom:.4rem}
.sessiontabs button,.subtabs button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:.35rem .9rem;font-family:var(--font-fa)}
.sessiontabs button{font-weight:700}
.sessiontabs button[aria-selected=true]{background:var(--red);color:var(--paper);border-color:var(--red)}
.subtabs button{font-size:.92rem}
.subtabs button[aria-selected=true]{background:var(--blue);color:var(--paper);border-color:var(--blue)}
.subtabs{margin:-.4rem 0 1.4rem}
.session .session-title{margin-top:1.4rem}
.pane-fa,.pane-todo{font-family:var(--font-fa);text-align:right;line-height:2}
.pane-fa h3,.pane-todo h3{font-size:1.15rem;margin:0 0 .8rem}
.pane-fa ul,.pane-todo ul{padding-inline-start:1.3em;margin:0 0 1.2em}
.pane-fa li,.pane-todo li{margin:.3em 0}
.todo>li{list-style:none;position:relative;border:2px solid var(--ink);padding:.6rem .9rem;margin:0 0 .8rem}
.todo>li::before{content:"";position:absolute;inset-inline-start:-2px;top:-2px;bottom:-2px;width:6px;background:var(--yellow)}
.todo{padding:0!important}
/* class diagram pane: an inline SVG that scrolls sideways on a narrow phone */
.pane-diagram .diagram-wrap{overflow-x:auto;margin:0 0 1.4rem;border:2px solid var(--ink);background:#fff;padding:.4rem}
.pane-diagram .diagram-hint{font-size:.85rem;opacity:.7;margin:0 0 .3rem}
.pane-diagram svg{display:block;width:100%;min-width:640px;height:auto}
.ant-diagram text{font-family:Jost,Arial,sans-serif;fill:#1d1d1b}
.ant-diagram .b{fill:#fff;stroke:#1d1d1b;stroke-width:2}
.ant-diagram .h{font-weight:700;font-size:17px}
.ant-diagram .t{font-size:14px}
.ant-diagram .s{font-size:12.5px;fill:#555}
.ant-diagram .l{stroke:#1d1d1b;stroke-width:2;fill:none}
.ant-diagram .d{stroke:#888;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
</style>
<script>
(function(){
  const KEY='dtad-tabs';
  let st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
  const top=[...document.querySelectorAll('.sessiontabs button')], secs=[...document.querySelectorAll('section.session')];
  function pane(sec,p){
    const btns=[...sec.querySelectorAll('.subtabs button')];
    if(!btns.some(b=>b.dataset.p===p)) p=btns[0].dataset.p;
    btns.forEach(b=>b.setAttribute('aria-selected',b.dataset.p===p));
    sec.querySelectorAll('.pane').forEach(d=>d.hidden=d.dataset.p!==p);
  }
  function session(s,scroll){
    if(!secs.some(x=>x.dataset.s===s)) s=secs[secs.length-1].dataset.s;
    top.forEach(b=>b.setAttribute('aria-selected',b.dataset.s===s));
    secs.forEach(x=>{x.hidden=x.dataset.s!==s; if(!x.hidden) pane(x,(st.p||{})[s]||'text');});
    st.s=s; save();
    if(scroll){const n=document.querySelector('.sessiontabs'); if(n.getBoundingClientRect().top<0) n.scrollIntoView();}
  }
  top.forEach(b=>b.onclick=()=>session(b.dataset.s,true));
  secs.forEach(sec=>sec.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{
    pane(sec,b.dataset.p); st.p=st.p||{}; st.p[sec.dataset.s]=b.dataset.p; save();
    const n=document.querySelector('.sessiontabs'); if(sec.getBoundingClientRect().top<0) n.scrollIntoView();
  }));
  session(st.s);
})();
</script>
