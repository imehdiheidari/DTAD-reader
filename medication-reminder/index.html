<style>
  /* Layout: one dose per page. A compact clock band on top, a row of square tabs (one per dose),
     and a single page for the chosen dose. Hard 4px black rules, pure primaries, shapes carry meaning. */
  :root {
    --red: #D52A1E;
    --blue: #1447A6;
    --yellow: #F7C600;
    --ink: #121212;
    --paper: #F4F2ED;
    --white: #FFFFFF;
    --mute: #55534D;
    --stroke: 4px;
    --stroke-thin: 3px;
    --font-latin: 'Jost', 'Futura', 'Century Gothic', 'Avenir Next', Arial, sans-serif;
    --font-fa: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
    color-scheme: light;
  }

  html, body { background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font-latin); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  html[lang="fa"] body { font-family: var(--font-fa); }
  * { box-sizing: border-box; }

  .num { font-variant-numeric: tabular-nums; }
  .display { font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; line-height: 1.02; text-wrap: balance; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  html[lang="fa"] .display, html[lang="fa"] .label, html[lang="fa"] .btn { text-transform: none; letter-spacing: 0; }
  html[lang="fa"] .label { font-size: 13px; }

  .fade-in { animation: fade 260ms ease both; }
  @keyframes fade { from { opacity: 0.25; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- top bar ---------- */
  .topbar { background: var(--ink); color: var(--white); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 61; background: var(--ink); }
  .topbar-inner {
    max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .lang { display: flex; border: 2px solid var(--white); flex: none; }
  .lang button {
    width: 42px; height: 32px; border: 0; background: transparent; color: var(--white); cursor: pointer;
    font: 700 13px/1 var(--font-latin); letter-spacing: 0.08em; transition: background 160ms, color 160ms;
  }
  .lang button + button { border-left: 2px solid var(--white); }
  .lang button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }
  .lang .fa { font-family: var(--font-fa); font-size: 15px; letter-spacing: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1rem; min-width: 0; }
  .brand-shapes { display: flex; gap: 4px; flex: none; }
  .brand-shapes i { width: 12px; height: 12px; display: block; }
  .brand-shapes .r { background: var(--red); }
  .brand-shapes .b { background: var(--blue); border-radius: 50%; box-shadow: 0 0 0 1px var(--white); }
  .brand-shapes .y { background: var(--yellow); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .brand-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- shell ---------- */
  .shell {
    max-width: 760px; margin: 0 auto;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 16px;
  }

  /* ---------- clock band: one thin strip ---------- */
  .band { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; background: var(--blue); color: var(--white); border: var(--stroke) solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 8px 14px; }
  .band::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink); flex: none; }
  .band-clock { font-size: 1.6rem; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
  .band-date { font-weight: 500; margin-inline-start: auto; }

  /* ---------- dose tabs ---------- */
  .tabs { display: flex; border: var(--stroke) solid var(--ink); background: var(--white); overflow-x: auto; scrollbar-width: none; }
  .tab {
    flex: 1 1 0; min-width: 84px; min-height: 54px; padding: 6px 10px; border: 0; border-inline-end: var(--stroke) solid var(--ink);
    background: var(--white); color: var(--ink); cursor: pointer; font-family: inherit; text-align: start;
    display: flex; flex-direction: column; justify-content: center; gap: 2px; transition: background 140ms;
  }
  .tab:hover { background: var(--paper); }
  .tab[aria-selected="true"] { background: var(--yellow); }
  .tab-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tab-time { font-weight: 800; font-size: 1.05rem; line-height: 1; }
  .tab .label { font-size: 11px; }
  .tab-add { flex: none; width: 56px; min-height: 54px; border: 0; background: var(--paper); cursor: pointer; display: grid; place-items: center; }
  .tab-add span { width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: var(--white); border: var(--stroke-thin) solid var(--ink); display: grid; place-items: center; font: 800 1.25rem/1 var(--font-latin); }
  .tab-add:disabled { cursor: not-allowed; opacity: 0.4; }

  .mk { width: 12px; height: 12px; flex: none; background: currentColor; display: inline-block; }
  .mk-taken { border-radius: 50%; }
  .mk-due { animation: blink 1s steps(2, start) infinite; }
  .mk-snoozed { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .mk-upcoming { background: transparent; border: 3px solid currentColor; }
  .tab .mk-taken { color: var(--blue); }
  .tab .mk-due { color: var(--red); }
  @keyframes blink { to { visibility: hidden; } }

  /* ---------- dose page ---------- */
  .page { border: var(--stroke) solid var(--ink); background: var(--white); box-shadow: 8px 8px 0 var(--ink); touch-action: pan-y; }
  .page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: var(--stroke) solid var(--ink); background: var(--paper); }
  .st-taken .page-head { background: var(--blue); color: var(--white); }
  .st-due .page-head { background: var(--red); color: var(--white); }
  .st-snoozed .page-head { background: var(--yellow); }
  .page-title { margin: 0; font-size: 1.35rem; }
  .time-input { width: 150px; min-height: 44px; border: var(--stroke-thin) solid var(--ink); background: var(--white); color: var(--ink); font: 700 1.05rem/1 var(--font-latin); padding: 0.4rem 0.6rem; border-radius: 0; }
  .page-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .meds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .med-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 2px solid var(--ink); min-width: 0; }
  .med-item:first-child { border-top: 2px solid var(--ink); }
  .med-dot { width: 16px; height: 16px; background: var(--yellow); border: 3px solid var(--ink); flex: none; }
  .med-name { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
  .med-qty { color: var(--mute); font-weight: 500; }

  .slot {
    width: 100%; min-height: 88px; border: var(--stroke-thin) dashed var(--ink); background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px;
    font-family: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: background 140ms;
  }
  .slot:hover { background: #ebe8e0; }
  .slot.big { min-height: 200px; }
  .slot .plus { width: 52px; height: 52px; border-radius: 50%; background: var(--blue); color: var(--white); border: var(--stroke-thin) solid var(--ink); display: grid; place-items: center; font: 800 1.8rem/1 var(--font-latin); }

  .med-form { display: grid; gap: 12px; width: 100%; padding: 14px; border: var(--stroke-thin) solid var(--ink); background: var(--paper); }
  .med-form .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
  .med-form label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

  .page-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-top: var(--stroke) solid var(--ink); background: var(--paper); }
  .pager { display: flex; align-items: center; gap: 10px; }
  .arrow { width: 0; height: 0; border-block: 9px solid transparent; }
  .arrow.prev { border-inline-end: 13px solid currentColor; }
  .arrow.next { border-inline-start: 13px solid currentColor; }

  /* ---------- buttons & fields ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
    border: var(--stroke-thin) solid var(--ink); border-radius: 0; background: var(--white); color: var(--ink);
    font-weight: 700; font-size: 0.95rem; line-height: 1.1; font-family: inherit; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0.6rem 1rem; min-height: 44px; cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink); transition: transform 80ms ease, box-shadow 80ms ease, background 120ms;
  }
  .btn:hover { background: var(--paper); }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-blue { background: var(--blue); color: var(--white); }
  .btn-blue:hover { background: #0f3a8a; }
  .btn-red { background: var(--red); color: var(--white); }
  .btn-red:hover { background: #b8221a; }
  .btn-yellow { background: var(--yellow); color: var(--ink); }
  .btn-yellow:hover { background: #e3b600; }
  .btn-sq { width: 44px; height: 44px; min-height: 0; padding: 0; box-shadow: 3px 3px 0 var(--ink); flex: none; }
  .btn-on { background: var(--yellow); color: var(--ink); }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .panel :focus-visible { outline-color: var(--yellow); }
  .field { width: 100%; min-height: 44px; border: var(--stroke-thin) solid var(--ink); border-radius: 0; background: var(--white); color: var(--ink); padding: 0.5rem 0.75rem; font: inherit; }

  /* ---------- test clock (browser only) ---------- */
  .panel { background: var(--ink); color: var(--white); border: var(--stroke) solid var(--ink); }
  .panel summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: center; gap: 12px; color: var(--yellow); font-weight: 800; }
  .panel summary::-webkit-details-marker { display: none; }
  .panel summary::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--yellow); flex: none; }
  .panel summary::after { content: ""; margin-inline-start: auto; border-inline: 7px solid transparent; border-top: 10px solid var(--yellow); }
  .panel[open] summary::after { transform: rotate(180deg); }
  .panel-body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 14px; }
  .panel p { margin: 0; color: #d8d6d0; max-width: 62ch; }
  .panel .btn { box-shadow: 4px 4px 0 var(--yellow); }
  .seg { display: flex; border: var(--stroke-thin) solid var(--white); }
  .seg button { min-width: 60px; min-height: 44px; border: 0; background: transparent; color: var(--white); font: 700 1rem/1 var(--font-latin); cursor: pointer; }
  .seg button + button { border-left: var(--stroke-thin) solid var(--white); }
  .seg button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }
  .panel-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  /* ---------- notification setup (Android app only) ---------- */
  .alarm-strip { display: flex; align-items: center; gap: 12px; width: 100%; border: var(--stroke) solid var(--ink); background: var(--red); color: var(--white); padding: 10px 14px; font-weight: 700; font-size: 1rem; line-height: 1.3; font-family: inherit; text-align: start; cursor: pointer; }
  .alarm-strip::before { content: ""; width: 14px; height: 14px; background: var(--white); flex: none; animation: blink 1s steps(2, start) infinite; }
  .setup { border: var(--stroke) solid var(--ink); background: var(--white); }
  .setup summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-weight: 800; }
  .setup summary::-webkit-details-marker { display: none; }
  .setup summary::after { content: ""; margin-inline-start: auto; border-inline: 7px solid transparent; border-top: 10px solid var(--ink); }
  .setup[open] summary::after { transform: rotate(180deg); }
  .setup-list { list-style: none; margin: 0; padding: 0 16px 8px; }
  .setup-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 2px solid var(--ink); }
  .setup-item .txt { flex: 1; min-width: 0; font-weight: 700; }
  .setup-item .hint { display: block; font-weight: 500; color: var(--mute); font-size: 0.9rem; }
  .ok-mark { width: 18px; height: 18px; border-radius: 50%; background: var(--blue); flex: none; }
  .bad-mark { width: 18px; height: 18px; background: var(--red); flex: none; }
  .unk-mark { width: 18px; height: 18px; border: 3px solid var(--ink); flex: none; }
  .setup-foot { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; border-top: 2px solid var(--ink); }

  /* ---------- reminder dialog ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: repeating-linear-gradient(135deg, rgba(18,18,18,0.72) 0 18px, rgba(18,18,18,0.6) 18px 36px);
  }
  .alert { width: 100%; max-width: 520px; max-height: 100%; overflow: auto; background: var(--white); color: var(--ink); border: 5px solid var(--ink); box-shadow: 14px 14px 0 var(--yellow); animation: drop 320ms cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes drop { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .alert-head { position: relative; overflow: hidden; background: var(--red); color: var(--white); padding: 22px; display: flex; align-items: center; gap: 18px; border-bottom: 5px solid var(--ink); }
  .alert-head h2 { margin: 2px 0 0; font-size: clamp(1.6rem, 6vw, 2.2rem); }
  .bell { width: 68px; height: 68px; flex: none; border-radius: 50%; background: var(--white); border: 5px solid var(--ink); display: grid; place-items: center; }
  .bell::after { content: ""; width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); border: 4px solid var(--ink); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.35); } }
  .alert-count { position: absolute; top: 0; inset-inline-end: 0; background: var(--yellow); color: var(--ink); border-bottom: 5px solid var(--ink); border-inline-start: 5px solid var(--ink); padding: 6px 12px; font-weight: 800; }
  .alert-body { padding: 18px 22px; }
  .alert-empty { margin: 0; font-weight: 500; color: var(--mute); }
  .alert-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 5px solid var(--ink); }
  .act { min-height: 116px; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 1.7rem; line-height: 1; font-family: inherit; text-transform: uppercase; letter-spacing: 0.02em; transition: filter 120ms; }
  html[lang="fa"] .act { text-transform: none; font-size: 2rem; }
  .act:hover { filter: brightness(1.08); }
  .act:active { filter: brightness(0.92); }
  .act-done { background: var(--blue); color: var(--white); }
  .act-later { background: var(--yellow); color: var(--ink); border-inline-start: 5px solid var(--ink); }
  .act-done .glyph { width: 30px; height: 30px; border-radius: 50%; background: var(--white); border: 4px solid var(--ink); }
  .act-later .glyph { width: 30px; height: 30px; background: var(--ink); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  html[dir="rtl"] .act-later .glyph { transform: scaleX(-1); }
  .alert-hint { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 12px 22px; background: var(--paper); border-top: 3px solid var(--ink); font-weight: 500; font-size: 0.92rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  const LANGS = [

  function unitLabel(unit, qty, lang) {
    const forms = I18N[lang].units[unit] || [unit];
    return Number(qty) === 1 || forms.length === 1 ? forms[0] : forms[1];
  }

  function makeFmt(lang) {
    const loc = LOCALES[lang];
    const timeF = new Intl.DateTimeFormat(loc, { hour: '2-digit', minute: '2-digit', hour12: lang === 'en' });
    const dateF = new Intl.DateTimeFormat(loc, { weekday: 'long', day: 'numeric', month: 'long' });
    const two = n => Number(n).toLocaleString(loc, { minimumIntegerDigits: 2, useGrouping: false });
    return {
      time: ms => timeF.format(ms),
      hhmm: s => timeF.format(atTime(Date.now(), s)),
      date: ms => dateF.format(ms),
      num: n => Number(n).toLocaleString(loc, { maximumFractionDigits: 2 }),
      countdown: ms => {
        const s = Math.max(0, Math.floor(ms / 1000));
        return `${two(Math.floor(s / 3600))}:${two(Math.floor((s % 3600) / 60))}:${two(s % 60)}`;
      }
    };
  }

  /* ---------------- time helpers ---------------- */
  const pad = n => String(n).padStart(2, '0');
  const dayKey = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const fromMin = min => `${pad(Math.floor(min / 60) % 24)}:${pad(min % 60)}`;
  function atTime(ms, hhmm) {
    const d = new Date(ms);
    const [h, m] = hhmm.split(':').map(Number);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0, 0).getTime();
  }
  const uid = () => Math.random().toString(36).slice(2, 10);
  const toLatinDigits = s => String(s)
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[٫,]/g, '.');

  // A new dose goes into the middle of the largest gap in the day, so custom times are kept.
  function timeForNewDose(doses) {
    const mins = doses.map(d => toMin(d.time)).sort((a, b) => a - b);
    if (mins.length === 0) return '08:00';
    if (mins.length === 1) return fromMin((mins[0] + 720) % 1440);
    let best = { gap: -1, start: 0 };
    mins.forEach((m, i) => {
      const nextM = i === mins.length - 1 ? mins[0] + 1440 : mins[i + 1];
      if (nextM - m > best.gap) best = { gap: nextM - m, start: m };
    });
    const mid = Math.round((best.start + best.gap / 2) / 5) * 5;
    return fromMin(((mid % 1440) + 1440) % 1440);
  }

  /* ---------------- storage ---------------- */
  // The app keeps the state (so its alarms can read it while the app is closed); a browser uses localStorage.
  function readJSON(key) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function load() {
    if (NATIVE) {
      try { const raw = NATIVE.load(); if (raw) return JSON.parse(raw); } catch (e) { /* fall back to web storage */ }
    }
    const s = readJSON(STORE_KEY);
    if (s) return s;
    const old = readJSON(OLD_STORE_KEY);   // earlier version: keep only the chosen language, drop the sample medications
    return old && old.lang ? { lang: old.lang } : null;
  }
  function save(state) {
    const json = JSON.stringify(state);
    if (NATIVE) { try { NATIVE.save(json); } catch (e) { /* ignore */ } }
    try { localStorage.setItem(STORE_KEY, json); } catch (e) { /* storage unavailable */ }
  }
  function detectLang() {
    try {
      const n = (navigator.language || '').slice(0, 2).toLowerCase();
      if (n === 'de' || n === 'en' || n === 'fa') return n;
    } catch (e) { /* ignore */ }
    return 'fa';
  }

  /* ---------------- sound & browser alerts (browser only; the app posts system notifications) ---------------- */
  let audioCtx = null;
  function unlockAudio() {
    try {
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* audio unavailable */ }
  }
  if (!NATIVE) window.addEventListener('pointerdown', unlockAudio);
  function chime() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const t0 = audioCtx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const s = t0 + i * 0.16;
        o.type = 'triangle';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.25, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.4);
        o.connect(g).connect(audioCtx.destination);
        o.start(s); o.stop(s + 0.45);
      });
    } catch (e) { /* ignore */ }
  }
  function browserNotify(title, body) {
    try {
      if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body });
    } catch (e) { /* not allowed here */ }
    try { if (audioCtx && navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
  }

  function DosePage({ row, total, t, f, lang, canRemove, onTime, onRemove, onAddMed, onUpdateMed, onRemoveMed, onPrev, onNext }) {
    const [adding, setAdding] = useState(false);
    const [confirming, setConfirming] = useState(false);
    const touch = useRef(null);
    useEffect(() => { setAdding(false); setConfirming(false); }, [row.dose.id]);
    useEffect(() => {
      if (!confirming) return;
      const id = setTimeout(() => setConfirming(false), 3000);
      return () => clearTimeout(id);
    }, [confirming]);

    // Swipe sideways to move between doses (direction follows the reading direction).
    const onTouchStart = e => {
      if (e.target.closest('input, select, textarea')) { touch.current = null; return; }
      const p = e.touches[0]; touch.current = { x: p.clientX, y: p.clientY };
    };
    const onTouchEnd = e => {
      if (!touch.current) return;
      const p = e.changedTouches[0];
      const dx = p.clientX - touch.current.x, dy = p.clientY - touch.current.y;
      touch.current = null;
      if (Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
      const forward = DIR[lang] === 'rtl' ? dx > 0 : dx < 0;
      forward ? onNext() : onPrev();
    };

    const { dose, status } = row;
    return html`<article id="dose-page" role="tabpanel" aria-labelledby=${'tab-' + dose.id}

          ? html`<ul className="meds">${dose.meds.map(m => html`<${MedRow} key=${m.id} med=${m} t=${t} f=${f} lang=${lang}
              onSave=${patch => onUpdateMed(m.id, patch)} onDelete=${() => onRemoveMed(m.id)} />`)}</ul>`
          : null}
        ${adding
          ? html`<${MedForm} t=${t} lang=${lang} idBase=${'new-' + dose.id} submitLabel=${t('addMed')}
              onCancel=${() => setAdding(false)} onSubmit=${m => { onAddMed(m); setAdding(false); }} />`

            <span className="arrow prev" aria-hidden="true"></span></button>

            <span className="arrow next" aria-hidden="true"></span></button>

            onClick=${() => (confirming ? onRemove() : setConfirming(true))}>

  const CHECKS = ['notif', 'channel', 'exact', 'battery', 'fsi'];
  function readStatus() {
    try { return NATIVE && NATIVE.status ? JSON.parse(NATIVE.status()) : null; } catch (e) { return null; }
  }

  function SetupPanel({ status, open, setOpen, t }) {
    const [testSet, setTestSet] = useState(false);
    const bad = CHECKS.filter(k => status[k] === false);
    return html`<details className="setup" id="setup" open=${open} onToggle=${e => setOpen(e.currentTarget.open)}>
      <summary>
        <span className=${bad.length ? 'bad-mark' : 'ok-mark'} aria-hidden="true"></span>
        ${t('setupTitle')}${bad.length ? '' : ' · ' + t('setupOk')}
      </summary>
      <ul className="setup-list">
        ${CHECKS.map(k => html`<li key=${k} className="setup-item">
          <span className=${status[k] ? 'ok-mark' : 'bad-mark'} aria-hidden="true"></span>
          <span className="txt">${t('chk_' + k)}${k === 'channel' && !status[k] ? html`<span className="hint">${t('channelHint')}</span>` : null}</span>
          ${status[k] ? null : html`<button type="button" className="btn btn-red" onClick=${() => NATIVE.openSettings(k)}>${t('fix')}</button>`}
        </li>`)}
        <li className="setup-item">
          <span className="unk-mark" aria-hidden="true"></span>
          <span className="txt">${t('chk_app')}<span className="hint">${t('appHint')}</span></span>
          <button type="button" className="btn" onClick=${() => NATIVE.openSettings('app')}>${t('open')}</button>
        </li>
      </ul>
      <div className="setup-foot">
        <button type="button" className="btn btn-yellow" onClick=${() => { NATIVE.test(); setTestSet(true); }}>${t('test')}</button>
        ${testSet ? html`<strong>${t('testSet')}</strong>` : null}
      </div>
    </details>`;
  }

  function TestPanel({ t, f, clock, isVirtual, setSpeed, jump, jumpToNext, realTime, resetToday, alertsOn, enableAlerts }) {
    return html`<details className="panel">
      <summary className="display">${t('testClock')}</summary>
      <div className="panel-body">
        <p>${t('webNote')}</p>
        <p>${t('testHint')}</p>
        <div className="panel-row">
          <span className="label">${t('speed')}</span>
          <div className="seg" role="group" aria-label=${t('speed')}>
            ${SPEEDS.map(s => html`<button key=${s} type="button" className="num" dir="ltr" aria-pressed=${clock.speed === s}
              onClick=${() => setSpeed(s)}>${f.num(s)}×</button>`)}
          </div>
        </div>
        <div className="panel-row">
          <button type="button" className="btn btn-yellow" data-test="plus30" onClick=${() => jump(SNOOZE_MS)}>${t('plus30')}</button>
          <button type="button" className="btn" data-test="jump" onClick=${jumpToNext}>${t('jumpNext')}</button>
          <button type="button" className="btn" disabled=${!isVirtual} onClick=${realTime}>${t('realTime')}</button>
          <button type="button" className="btn btn-red" onClick=${resetToday}>${t('resetToday')}</button>
          <button type="button" className=${'btn ' + (alertsOn ? 'btn-on' : '')} onClick=${enableAlerts}>
            ${alertsOn ? t('alertsOn') : t('alerts')}
          </button>
        </div>
      </div>
    </details>`;
  }

  /* ---------------- app ---------------- */
  function App() {
    const stored = useMemo(load, []);
    const [lang, setLang] = useState(stored && I18N[stored.lang] ? stored.lang : detectLang());
    const [doses, setDoses] = useState(stored && Array.isArray(stored.doses) && stored.doses.length ? stored.doses : defaultDoses);
    const [log, setLog] = useState((stored && stored.log) || {});         // "YYYY-MM-DD|doseId" -> taken-at ms
    const [snoozes, setSnoozes] = useState((stored && stored.snoozes) || {}); // key -> { nextAt, count }
    const [selectedId, setSelectedId] = useState(null);
    const [alertsOn, setAlertsOn] = useState(false);
    const [status, setStatus] = useState(readStatus);
    const [setupOpen, setSetupOpen] = useState(() => { const st = readStatus(); return !!st && CHECKS.some(k => st[k] === false); });
    useEffect(() => {
      if (!NATIVE) return;
      const id = setInterval(() => setStatus(readStatus()), 3000);
      return () => clearInterval(id);
    }, []);
    const setupBad = !!status && CHECKS.some(k => status[k] === false);

    // Virtual clock (browser test panel only): real time by default, can be sped up or moved forward.
    const [clock, setClock] = useState(() => ({ baseReal: Date.now(), baseVirt: Date.now(), speed: 1 }));
    const [, setTick] = useState(0);
    useEffect(() => { const id = setInterval(() => setTick(x => x + 1), 250); return () => clearInterval(id); }, []);
    const virtNow = c => c.baseVirt + (Date.now() - c.baseReal) * c.speed;
    const now = virtNow(clock);
    const isVirtual = clock.speed !== 1 || Math.abs(now - Date.now()) > 2000;

    // Save every change at once, so the chosen language and the schedule survive closing the app.
    const first = useRef(true);
    useEffect(() => {
      if (first.current && stored && stored.doses) { first.current = false; return; }
      first.current = false;
      save({ lang, doses, log, snoozes });
    }, [lang, doses, log, snoozes]);
    useEffect(() => { document.documentElement.lang = lang; document.documentElement.dir = DIR[lang]; }, [lang]);

    // The app calls this after Done / Later was pressed on a system notification, and when it comes back to the front.
    useEffect(() => {
      window.__doseReload = () => {
        const s = load();
        if (!s) return;
        if (I18N[s.lang]) setLang(s.lang);
        if (Array.isArray(s.doses) && s.doses.length) setDoses(s.doses);
        setLog(s.log || {});
        setSnoozes(s.snoozes || {});
        setStatus(readStatus());
      };
      return () => { delete window.__doseReload; };
    }, []);

    const t = useCallback((k, vars) => {
      let s = I18N[lang][k] != null ? I18N[lang][k] : (I18N.en[k] != null ? I18N.en[k] : k);
      if (vars) Object.keys(vars).forEach(v => { s = s.replace('{' + v + '}', vars[v]); });
      return s;
    }, [lang]);
    const f = useMemo(() => makeFmt(lang), [lang]);

    /* ----- each dose's state for the current day ----- */
    const today = dayKey(now);
    const sorted = [...doses].sort((a, b) => toMin(a.time) - toMin(b.time));
    const rows = sorted.map((dose, index) => {
      const key = today + '|' + dose.id;
      const sched = atTime(now, dose.time);
      const takenAt = log[key];
      const sn = snoozes[key];
      const count = (sn ? sn.count : 0) + 1;
      let status, at = null;
      if (takenAt) { status = 'taken'; at = takenAt; }
      else if (now < sched) { status = 'upcoming'; at = sched; }
      else if (sn && now < sn.nextAt) { status = 'snoozed'; at = sn.nextAt; }
      else { status = 'due'; }
      return { dose, index, key, sched, status, at, count };
    });
    const due = rows.filter(r => r.status === 'due');
    const pending = rows.filter(r => r.status === 'upcoming' || r.status === 'snoozed').sort((a, b) => a.at - b.at);
    const next = pending[0]
      ? { at: pending[0].at, row: pending[0], tomorrow: false }
      : sorted[0] ? { at: atTime(now + DAY_MS, sorted[0].time), row: null, tomorrow: true } : null;

    // The page shown: the one picked, otherwise the dose that is due, otherwise the next one.
    const fallback = (due[0] || pending[0] || rows[0]);
    const current = rows.find(r => r.dose.id === selectedId) || fallback;
    const go = step => {
      const i = current.index + step;
      if (rows[i]) setSelectedId(rows[i].dose.id);
    };

    /* ----- ring once each time a dose becomes due (the app does this with system notifications) ----- */
    const seen = useRef(new Set());
    const dueSig = due.map(r => r.key + '#' + r.count).join(',');
    useEffect(() => {
      if (NATIVE) return;
      due.forEach(r => {
        const sig = r.key + '#' + r.count;
        if (seen.current.has(sig)) return;
        seen.current.add(sig);
        chime();
        browserNotify(t('notifTitle'), r.dose.meds.map(m => `${m.name} × ${f.num(m.qty)}`).join(' · '));
      });
    }, [dueSig]);
    useEffect(() => {
      document.title = due.length ? `(${due.length}) ${t('notifTitle')}` : t('appName');
    }, [due.length, lang]);

    /* ----- reminder actions ----- */
    const markDone = r => {
      setLog(l => ({ ...l, [r.key]: now }));
      setSnoozes(s => { const n = { ...s }; delete n[r.key]; return n; });
    };
    const snooze = r => setSnoozes(s => ({ ...s, [r.key]: { nextAt: now + SNOOZE_MS, count: r.count } }));

    /* ----- schedule editing ----- */
    const updateDose = (id, patch) => setDoses(ds => ds.map(d => (d.id === id ? { ...d, ...patch } : d)));
    const removeDose = id => {
      const i = rows.findIndex(r => r.dose.id === id);
      const neighbour = rows[i + 1] || rows[i - 1];
      setDoses(ds => (ds.length > 1 ? ds.filter(d => d.id !== id) : ds));
      if (neighbour) setSelectedId(neighbour.dose.id);
    };
    const addDose = () => {
      if (doses.length >= MAX_DOSES) return;
      const d = { id: uid(), time: timeForNewDose(doses), meds: [] };
      setDoses(ds => [...ds, d]);
      setSelectedId(d.id);
    };
    const addMed = (doseId, med) => setDoses(ds => ds.map(d => (d.id === doseId ? { ...d, meds: [...d.meds, { id: uid(), ...med }] } : d)));
    const updateMed = (doseId, medId, patch) => setDoses(ds => ds.map(d => (d.id === doseId ? { ...d, meds: d.meds.map(m => (m.id === medId ? { ...m, ...patch } : m)) } : d)));
    const removeMed = (doseId, medId) => setDoses(ds => ds.map(d => (d.id === doseId ? { ...d, meds: d.meds.filter(m => m.id !== medId) } : d)));

    /* ----- test clock ----- */
    const setSpeed = speed => setClock(c => ({ baseReal: Date.now(), baseVirt: virtNow(c), speed }));
    const jump = ms => setClock(c => ({ baseReal: Date.now(), baseVirt: virtNow(c) + ms, speed: c.speed }));
    const jumpToNext = () => { if (next) setClock(c => ({ baseReal: Date.now(), baseVirt: Math.max(virtNow(c), next.at), speed: c.speed })); };
    const realTime = () => setClock({ baseReal: Date.now(), baseVirt: Date.now(), speed: 1 });
    const resetToday = () => {
      const strip = o => Object.fromEntries(Object.entries(o).filter(([k]) => !k.startsWith(today + '|')));
      setLog(strip); setSnoozes(strip);
      seen.current = new Set([...seen.current].filter(k => !k.startsWith(today + '|')));
    };
    const enableAlerts = () => {
      unlockAudio();
      setAlertsOn(true);
      try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) { /* ignore */ }
      setTimeout(chime, 60);
    };

    return html`<${React.Fragment}>
      <header className="topbar">
        <div className="topbar-inner" dir="ltr">
          <${LangToggle} lang=${lang} setLang=${setLang} />
          <span className="brand" dir=${DIR[lang]}>
            <span className="brand-shapes" aria-hidden="true"><i className="r"></i><i className="b"></i><i className="y"></i></span>
            <span className="brand-name">${t('appName')}</span>
          </span>
        </div>
      </header>

      <main key=${lang} className="shell fade-in">
        ${setupBad ? html`<button type="button" className="alarm-strip" onClick=${() => {
            setSetupOpen(true);
            setTimeout(() => { const el = document.getElementById('setup'); if (el) el.scrollIntoView({ block: 'start' }); }, 50);
          }}>${t('setupBad')}</button>` : null}
        <section className="band" aria-label=${t('now')}>
          <span className="label">${isVirtual ? t('testTime') : t('now')}</span>
          <span className="band-clock num" dir="ltr">${f.time(now)}</span>
          <span className="band-date">${f.date(now)}</span>
        </section>

        <${DoseTabs} rows=${rows} selectedId=${current.dose.id} onSelect=${setSelectedId}
          onAdd=${addDose} canAdd=${doses.length < MAX_DOSES} t=${t} f=${f} />

        <${DosePage} key=${current.dose.id} row=${current} total=${rows.length} t=${t} f=${f} lang=${lang}
          canRemove=${doses.length > 1}
          onTime=${time => updateDose(current.dose.id, { time })}
          onRemove=${() => removeDose(current.dose.id)}
          onAddMed=${m => addMed(current.dose.id, m)}
          onUpdateMed=${(id, p) => updateMed(current.dose.id, id, p)}
          onRemoveMed=${id => removeMed(current.dose.id, id)}
          onPrev=${() => go(-1)} onNext=${() => go(1)} />

        ${status ? html`<${SetupPanel} status=${status} open=${setupOpen} setOpen=${setSetupOpen} t=${t} />` : null}

        ${NATIVE ? null : html`<${TestPanel} t=${t} f=${f} clock=${clock} isVirtual=${isVirtual} setSpeed=${setSpeed} jump=${jump}
          jumpToNext=${jumpToNext} realTime=${realTime} resetToday=${resetToday}
          alertsOn=${alertsOn} enableAlerts=${enableAlerts} />`}
      </main>

      ${due.length
        ? html`<${ReminderDialog} row=${due[0]} extra=${due.length - 1} t=${t} f=${f} lang=${lang}
            onDone=${() => markDone(due[0])} onLater=${() => snooze(due[0])} />`
        : null}
    <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
